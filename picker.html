<script src="https://apis.google.com/js/api.js"></script>
<script>
function post(type, payload) {
  try { window.webkit.messageHandlers.drivePicker.postMessage({ type: type, payload: payload }); } catch (e) {}
}
function onApiLoad() {
  gapi.load('auth2', function() {
    gapi.auth2.init({
      client_id: '6571635697-rual82058960vmv03oprregdu4vt9m2c.apps.googleusercontent.com',
      scope: 'https://www.googleapis.com/auth/drive.file',
      fetch_basic_profile: false
    }).then(function() {
      var auth2 = gapi.auth2.getAuthInstance();
      if (auth2.isSignedIn.get()) { onSignedIn(auth2.currentUser.get()); }
      else { auth2.signIn().then(onSignedIn, function(e){ post('error','Google sign-in failed.'); }); }
    }, function(e) { post('error','Could not initialize Google sign-in.'); });
  });
}
function onSignedIn(googleUser) {
  var accessToken = googleUser.getAuthResponse().access_token;
  gapi.load('picker', function() {
    var view = new google.picker.DocsView(google.picker.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(false);
    var picker = new google.picker.PickerBuilder()
      .addView(view)
      .setOAuthToken(accessToken)
      .setAppId('6571635697')
      .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
      .setCallback(function(data) {
        var action = data[google.picker.Response.ACTION];
        if (action === google.picker.Action.PICKED) {
          var docs = data[google.picker.Response.DOCUMENTS] || [];
          var files = [];
          for (var i=0;i<docs.length;i++) {
            var d = docs[i];
            files.push({ id: d[google.picker.Document.ID], name: d[google.picker.Document.NAME], mimeType: d[google.picker.Document.MIME_TYPE]||'', sizeBytes: d[google.picker.Document.SIZE_BYTES]||0 });
          }
          post('result', { token: accessToken, files: files });
        } else if (action === google.picker.Action.CANCEL) {
          post('cancel', null);
        }
      })
      .build();
    picker.setVisible(true);
  });
}
</script>
<script src="https://apis.google.com/js/api.js?onload=onApiLoad"></script>
